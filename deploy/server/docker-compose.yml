name: gimnasio-sara-rds
services:
  backend:
    image: gimnasio-sara-rds:1.0.0
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      DB_URL: ${DB_URL:?Configura DB_URL con la URL JDBC de RDS en .env}
      DB_USER: ${DB_USER:?Configura DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
    volumes:
      - ./certs:/app/certs:ro
    expose:
      - "8080"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  nginx:
    image: nginx:stable-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 8 -O /dev/null http://127.0.0.1/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
