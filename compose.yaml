name: gimnasio-sara
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-gimnasio}
      POSTGRES_USER: ${DB_USER:-gimnasio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  app:
    image: gimnasio-sara:1.0.0
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      # db es el nombre del servicio PostgreSQL dentro de la red de Compose.
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-gimnasio}
      DB_USER: ${DB_USER:-gimnasio}
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
